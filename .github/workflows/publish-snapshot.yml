name: Publish snapshot

# Publishes a -SNAPSHOT of tech.hearth:crypto to the Central Portal snapshots
# repository on every push to main that touches the java/ library. Snapshots need
# no GPG signing or javadoc — a plain `mvn deploy` sends jar + sources + POM to
# the snapshotRepository configured in java/pom.xml.
#
# Uses the same Central token secrets as the release workflow (no GPG key needed):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD

on:
  push:
    branches: [main]
    paths: ['java/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK + Maven settings (Central creds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Resolve project version
        id: version
        working-directory: java
        run: echo "value=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Deploy snapshot
        if: endsWith(steps.version.outputs.value, '-SNAPSHOT')
        working-directory: java
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
