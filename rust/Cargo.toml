[package]
name = "hearth"
version = "0.1.0"
edition = "2024"
description = "Ed25519 + ECVRF (RFC 9381) + BLS derivation crypto library, pure Rust"
license = "MIT OR Apache-2.0"

[dependencies]
# edwards25519 group/scalar arithmetic (the VRF math) + Ed25519 signatures.
curve25519-dalek = "4"
ed25519-dalek = "2"
# hashing / MAC.
sha2 = "0.10"
hmac = "0.12"
# BLS12-381 scalar-field arithmetic for EIP-2333 (mod r).
num-bigint = "0.4"
num-traits = "0.2"
# BLS12-381 pairing / groups for BLS signatures (RFC draft-irtf-cfrg-bls-signature-05).
bls12_381 = { version = "0.8", features = ["experimental"] }
group = "0.13"
pairing = "0.23"
digest = "0.10"
# bls12_381 0.8's hash-to-curve is built against digest 0.9; sha2 0.9 (renamed)
# names that exact `Sha256` for `ExpandMsgXmd`, distinct from the sha2 0.10 the
# rest of this crate uses.
sha2_09 = { package = "sha2", version = "0.9" }
# BIP-39 NFKD normalization.
unicode-normalization = "0.1"
# HPKE (RFC 9180): AEADs for the three registered suites, and a CSPRNG for
# X25519 keypairs / API-key generation.
rand = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

[dev-dependencies]
# the sample app (examples/hearth-demo.rs) only.
base64 = "0.22"
