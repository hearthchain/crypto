[project]
name = "hearth-chain"
version = "0.1.0"
description = "hearth-chain crypto foundation: Ed25519 + ECVRF (RFC 9381) + BLS derivation, on libsodium"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5.0", # libsodium bindings
    "cryptography>=43", # X25519 + AEAD for hearth.hpke / hearth.apikeyenvelope
]

[project.scripts]
hearth-demo = "hearth.demo:main"
hearth-hpke-example = "hearth.hpke_example:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
